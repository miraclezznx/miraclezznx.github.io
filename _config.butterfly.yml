# Butterfly 主题配置

# 头像
avatar:
  img: /img/avatar.png
  effect: true

# 顶部导航栏
nav:
  logo:
  display_title: true
  fixed: false

#菜单
menu:
  首页: / || fas fa-home
  归档: /archives/ || fas fa-archive
  标签: /tags/ || fas fa-tags
  分类: /categories/ || fas fa-folder-open
  友链: /link/ || fas fa-link

# 首页
index_img: /img/background.jpg

# 默认文章封面
default_top_img: /img/background.jpg

# 文章页
post_meta:
  date_type: created
  date_format: YYYY-MM-DD
  categories: true
  tags: true

# GitHub
social:
  fab fa-github: https://github.com/miraclezznx

# 作者卡片
aside:
  card_author:
    button:
      enable: true
      icon: fab fa-github
      text: Follow Me
      link: https://github.com/miraclezznx
  card_announcement:
    enable: true
    content: 本站持续更新中，欢迎关注

# 网站背景
background: /img/background.jpg

# 页脚背景
footer_img: false

inject:
  head:
    - '<link rel="stylesheet" href="/css/custom.css">'